<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Lived Calculator</title>

    <!-- Link to External CSS -->
    <link rel="stylesheet" href="/home/devamitrarajithlal/milla/css.style">
</head>

<body>
    <div class="calculator-section">
        <h2>Days Lived Calculator</h2>
        <p>Enter your date of birth:</p>
        <input type="date" id="dob-input">
        <button onclick="calculateDays()">Calculate</button>
        <div id="result" class="result-text"></div>

        <div class="links">
            <a href="index.html">Back to Home</a>
        </div>
    </div>

    <script>
        function calculateDays() {
            const dobInput = document.getElementById("dob-input").value;

            if (!dobInput) {
                document.getElementById("result").innerText = "Please select a date.";
                return;
            }

            const dob = new Date(dobInput);
            const today = new Date();

            if (dob > today) {
                document.getElementById("result").innerText = "Date of birth cannot be in the future.";
                return;
            }

            const diffTime = today - dob;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            document.getElementById("result").innerText =
                "You have lived for " + diffDays + " days.";
        }
    </script>
</body>
</html>
